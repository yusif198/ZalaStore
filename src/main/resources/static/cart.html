<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f1">
  <script>document.documentElement.dataset.theme = localStorage.getItem("zalastore.theme.v1") === "dark" ? "dark" : "light";</script>
  <meta name="description" content="ZalaStore geyim mağazası">
  <title>ZalaStore — Səbət</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/store-service.js?v=js-backend-1" defer></script>
  <script src="/app.js?v=js-backend-1" defer></script>
</head>
<body>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <header class="topbar">
    <a class="brand" href="/index.html" data-view="store" aria-label="ZalaStore ana səhifə">
      <span class="brand-mark">Z</span>
      <span>Zala<span class="brand-light">Store</span></span>
    </a>
    <nav id="main-nav" class="main-nav" aria-label="Əsas menyu">
      <a class="nav-link active" href="/index.html" data-view="store">Mağaza</a>
      <a class="nav-link signed-in-only" href="/orders.html" data-view="orders">Sifarişlərim</a>
      <a class="nav-link customer-only" href="/profile.html" data-view="profile">Hesabım</a>
      <a class="nav-link manager-only" href="/inventory.html" data-view="inventory">Məhsullar və stok</a>
      <a class="nav-link admin-only" href="/dashboard.html" data-view="dashboard">İdarəetmə paneli</a>
      <a class="nav-link manager-only" href="/sales.html" data-view="sales">Satışlar</a>
      <a class="nav-link admin-only" href="/reports.html" data-view="reports">Hesabatlar</a>
      <a class="nav-link admin-only" href="/users.html" data-view="users">İstifadəçilər</a>
    </nav>
    <div class="account-actions">
      <a id="cart-open" class="cart-account-button customer-only" href="/cart.html" data-view="cart" aria-label="Səbətə keç">
        <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span id="cart-count" class="count-badge">0</span>
      </a>
      <span id="user-chip" class="user-chip hidden"></span>
      <a id="login-open" class="button button-quiet" href="/login">Daxil ol</a>
      <button id="logout-button" class="button button-dark hidden">Çıxış</button>
      <button id="theme-toggle" class="theme-toggle" type="button">☾</button>
    </div>
  </header>

  <main data-page="cart">
<section id="view-cart" class="view active page-view">
      <div class="page-heading">
        <span class="eyebrow">ALIŞ-VERİŞ</span>
        <h1>Səbətim</h1>
        <p>Seçdiyin məhsulları yoxla və sifarişini tamamla.</p>
      </div>
      <div id="cart-content"></div>
    </section>
  </main>
  <footer class="site-footer">
    <a class="brand" href="/index.html" data-view="store"><span class="brand-mark">Z</span><span>Zala<span class="brand-light">Store</span></span></a>
    <span>Geyimində özünü tap. <span class="footer-dot">●</span> Bakı, Azərbaycan</span>
    <span>© <span id="footer-year"></span> ZalaStore</span>
  </footer>
</body>
</html>
